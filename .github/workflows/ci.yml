name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A real Redis for the restart-persistence tests; without
    # MATAH_TEST_REDIS_URL they skip the Redis cases.
    services:
      redis:
        # Digest-pinned; refresh by hand, Dependabot does not track service images.
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MATAH_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundles
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run client component tests
        run: npm run test:client

      - name: Enforce server coverage thresholds
        run: npm run test:coverage:server

      - name: Enforce client helper coverage thresholds
        run: npm run test:coverage:client

      - name: Audit production dependencies
        run: npm audit --omit=dev --include=prod --audit-level=high

  socket-smoke:
    name: Socket.IO smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Run isolated compiled-server smoke tests
        run: npm run test:smoke

  bounded-load:
    name: 25-room bounded load
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Run 60-second load and leak check
        run: npm run test:load

  browser:
    name: Chromium browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser, RTL, and accessibility flows
        env:
          CI: true
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-output
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: Docker production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        run: docker build --tag matah-ci:${{ github.sha }} .

      - name: Verify container health and home page
        env:
          IMAGE_TAG: matah-ci:${{ github.sha }}
        run: |
          CONTAINER_ID=$(docker run --detach --env PUBLIC_ORIGIN=http://127.0.0.1:3001 --publish 3001:3001 "$IMAGE_TAG")
          trap 'docker logs "$CONTAINER_ID"; docker rm --force "$CONTAINER_ID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:3001/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
