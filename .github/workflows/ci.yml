name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundles
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run client component tests
        run: npm run test:client

      - name: Enforce server coverage thresholds
        run: npm run test:coverage:server

      - name: Enforce client helper coverage thresholds
        run: npm run test:coverage:client

      - name: Audit production dependencies
        run: npm audit --omit=dev --include=prod --audit-level=high

  socket-smoke:
    name: Socket.IO smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Run isolated compiled-server smoke tests
        run: npm run test:smoke

  bounded-load:
    name: 25-room bounded load
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Run 60-second load and leak check
        run: npm run test:load

  browser:
    name: Chromium browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build production bundles
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser, RTL, and accessibility flows
        env:
          CI: true
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-output
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: Docker production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        run: docker build --tag matah-ci:${{ github.sha }} .

      - name: Verify container health and home page
        env:
          IMAGE_TAG: matah-ci:${{ github.sha }}
        run: |
          CONTAINER_ID=$(docker run --detach --env PUBLIC_ORIGIN=http://127.0.0.1:3001 --publish 3001:3001 "$IMAGE_TAG")
          trap 'docker logs "$CONTAINER_ID"; docker rm --force "$CONTAINER_ID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:3001/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
