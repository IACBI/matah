version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-jsx-a11y tops out at a peer of eslint ^9 and 6.10.2 is its
      # newest release, so nothing in the tree can move to eslint 10 yet: the
      # bump fails `npm ci` outright with ERESOLVE. Both halves need naming —
      # ignoring only @eslint/js (#17) just brought the same break back as
      # eslint itself (#27). Drop both once jsx-a11y ships eslint 10 support.
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor
      # vitest and its coverage provider pin each other to an exact version, so
      # a lone bump of either always fails to resolve. Keep them in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # react and react-dom must cross a major together; bumping react alone
      # renders "Objects are not valid as a React child" at runtime.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react reaches into vite's internals, so its majors are
      # tied to vite's — plugin-react 6 imports `vite/internal`, which vite 7
      # does not export.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    groups:
      actions:
        patterns:
          - "*"

  # The repository ships a Dockerfile, so its base image needs update coverage
  # too — otherwise node:24-alpine silently ages.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
