version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      # @eslint/js 10 declares a peer of eslint ^10, but eslint-plugin-jsx-a11y
      # tops out at eslint ^9 (6.10.2 is its newest release). Taking the major
      # alone breaks `npm prune --omit=dev` in the Docker build with ERESOLVE.
      # Drop this entry once jsx-a11y ships eslint 10 support.
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor
      # vitest and its coverage provider pin each other to an exact version, so
      # a lone bump of either always fails to resolve. Keep them in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
    groups:
      actions:
        patterns:
          - "*"

  # The repository ships a Dockerfile, so its base image needs update coverage
  # too — otherwise node:24-alpine silently ages.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Istanbul
