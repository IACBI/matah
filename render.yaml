# Render Blueprint: one Node service hosts both the Socket.IO server and the
# compiled browser application.
services:
  - type: web
    name: matah
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render's router is the single proxy in front of this process.
      - key: MATAH_TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_ORIGIN
        # No default: this is a public repository, so baking in the author's
        # own deployment origin would make every other clone's Socket.IO
        # handshake reject its own traffic. sync: false prompts the operator
        # to set the real origin when the blueprint is created.
        sync: false
