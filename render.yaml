# Render Blueprint: one Node service hosts both the Socket.IO server and the
# compiled browser application.
services:
  - type: web
    name: matah
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_ORIGIN
        value: https://quibble-0rjn.onrender.com
